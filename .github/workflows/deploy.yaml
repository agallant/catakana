name: Deploy to GitHub Pages

# Merges made by the auto-merge bot use GITHUB_TOKEN, which does not trigger `push` workflows.
# A frequent schedule picks those merges up; it exits early when gh-pages is already current.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether gh-pages is already current
        id: current
        run: |
          deployed=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          if [ -n "$deployed" ]; then
            git fetch -q --depth 1 origin gh-pages
            msg=$(git log -1 --format=%s FETCH_HEAD)
          else
            msg=""
          fi
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$msg" = "Deploy $head" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.current.outputs.skip != 'true'
        run: npm ci
      - if: steps.current.outputs.skip != 'true'
        run: npm run build
      - name: Publish dist to gh-pages
        if: steps.current.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ steps.current.outputs.head }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${HEAD_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
